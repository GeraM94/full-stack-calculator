# docker compose up --build   ->   http://localhost:3000
#
# Two services on the default network of the project. Only nginx is published:
# the browser talks to one origin, and nginx reaches the API by service name.
#
# Optional overrides, from the shell or a .env file:
#   FRONTEND_PORT   port published on the host      (default 3000)
#   BACKEND_PORT    port the API listens on inside  (default 8080)

# Fixed, so container and network names do not depend on the clone folder.
name: calculator

services:
  backend:
    build: ./backend
    environment:
      PORT: ${BACKEND_PORT:-8080}
    healthcheck:
      # The distroless image has no shell and no wget: the binary checks itself.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: ${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
